# Entry point for CI/CD. Everything else under .github/workflows is a reusable
# workflow called from here, so the trigger and gating rules live in one place.
#
#   build-and-test     every push, pull request and dispatch (Nix, Linux)
#   package-*          every push and dispatch, never for pull requests: a
#                      same-repository PR already ran them on its branch push
#   release            tags only, once every platform has packaged
#
# SPDX-License-Identifier: GPL-3.0-or-later

name: Main CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# One run per ref; superseded runs are cancelled except for tag (release) builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    uses: ./.github/workflows/build-and-test.yml

  package-linux:
    name: Package Linux
    if: github.event_name != 'pull_request'
    needs: build-and-test
    uses: ./.github/workflows/package-linux.yml
    with:
      artifact_name: ld-decode-tools-linux
      retention_days: 30

  package-macos:
    name: Package macOS
    if: github.event_name != 'pull_request'
    needs: build-and-test
    uses: ./.github/workflows/package-macos.yml
    with:
      artifact_name: ld-decode-tools-macos
      retention_days: 30

  package-windows:
    name: Package Windows
    if: github.event_name != 'pull_request'
    needs: build-and-test
    uses: ./.github/workflows/package-windows.yml
    with:
      artifact_name: ld-decode-tools-windows
      retention_days: 30

  # Single release job so the GitHub release is created exactly once with all
  # platform assets (no create-release race between parallel jobs, and no
  # partially-published release when one platform fails).
  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - package-linux
      - package-macos
      - package-windows
    permissions:
      contents: write
    uses: ./.github/workflows/release-from-artifact.yml
    with:
      artifact_pattern: ld-decode-tools-*
      file_glob: release-artifacts/*
