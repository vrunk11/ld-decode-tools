# macOS package: ld-analyse.app with every command-line tool inside it
# (Contents/MacOS), so all of them share one set of bundled Qt frameworks,
# delivered as a DMG.
#
# Command-line use: /Applications/ld-analyse.app/Contents/MacOS/<tool>
#
# SPDX-License-Identifier: GPL-3.0-or-later

name: Package macOS

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the uploaded DMG artifact
        required: false
        default: ld-decode-tools-macos
        type: string
      retention_days:
        description: Artifact retention in days
        required: false
        default: 30
        type: number

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # .gitmodules lists ezpwd but no submodule commit is recorded in the tree,
      # so a submodule checkout fetches nothing. Clone the Reed-Solomon headers
      # at the revision flake.lock pins (the input Nix builds use).
      - name: Fetch ezpwd-reed-solomon headers
        shell: bash
        run: |
          git clone --quiet https://github.com/pjkundert/ezpwd-reed-solomon external/ezpwd-reed-solomon
          git -C external/ezpwd-reed-solomon checkout --quiet 62a490c13f6e057fbf2dc6777fde234c7a19098e
          test -f external/ezpwd-reed-solomon/c++/ezpwd/rs_base

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="git-${GITHUB_SHA:0:7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        shell: bash
        run: |
          # A flaky Homebrew API download should not abort the build; fall back
          # to the existing metadata after a few attempts.
          for i in 1 2 3; do
            brew update && break
            echo "brew update failed (attempt $i), retrying..."
            sleep 15
          done || echo "brew update failed after retries; continuing with existing metadata"

          for dep in ninja pkg-config fftw; do
            brew list --versions "$dep" > /dev/null 2>&1 || brew install "$dep"
          done

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.9.*'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true
          modules: "qtmultimedia"

      # libebml and libmatroska (the LDX container and ld-container) from the
      # manifest, which must work; then libavfilter for the video filters of
      # ld-analyse and libavcodec for FLAC and FFV1 in LDX files: the manifest's
      # "ffmpeg" feature, a minimal shared build with no third-party codecs, so
      # macdeployqt bundles a few dylibs rather than Homebrew's whole ffmpeg
      # dependency tree. A failure of ffmpeg leaves the package without the
      # filters and without compression in LDX files (with a warning) instead
      # of failing it.
      - name: Cache ffmpeg from vcpkg
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: vcpkg_installed
          key: vcpkg-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}

      - name: Build libebml, libmatroska and ffmpeg with vcpkg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          brew install nasm autoconf automake libtool || true
          if [[ "$(uname -m)" == arm64 ]]; then triplet=arm64-osx-dynamic; else triplet=x64-osx-dynamic; fi
          # A full clone: vcpkg resolves the builtin-baseline of vcpkg.json from its history
          git clone --quiet https://github.com/microsoft/vcpkg.git vcpkg
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          ./vcpkg/vcpkg install \
            --triplet "$triplet" \
            --x-manifest-root=. \
            --x-install-root="$PWD/vcpkg_installed"
          ./vcpkg/vcpkg install \
            --triplet "$triplet" \
            --x-manifest-root=. \
            --x-install-root="$PWD/vcpkg_installed" \
            --x-feature=ffmpeg \
            || echo "::warning::ffmpeg was not built: no video filters in ld-analyse, no FLAC or FFV1 in LDX files"

      - name: Configure and build
        shell: bash
        run: |
          # ffmpeg from vcpkg, if it was built (see above)
          for dir in vcpkg_installed/*/lib/pkgconfig; do
            [[ -d "$dir" ]] && export PKG_CONFIG_PATH="$PWD/$dir${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          done
          # libebml and libmatroska, found by CMake
          prefix_path=""
          for dir in vcpkg_installed/*-osx-dynamic; do
            [[ -d "$dir" ]] && prefix_path="$PWD/$dir${prefix_path:+;$prefix_path}"
          done
          # Homebrew's fftw is single-architecture, so build for the runner's
          # architecture only even though Qt itself is universal.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="$(uname -m)" \
            -DBUILD_TESTING=OFF \
            "-DCMAKE_PREFIX_PATH=$prefix_path" \
            -DEZPWD_DIR="$PWD/external/ezpwd-reed-solomon/c++" \
            -DAPP_BRANCH=github-actions \
            -DAPP_COMMIT=${{ steps.version.outputs.version }}
          if ! grep -q '^FFMPEG_FOUND:INTERNAL=1' build/CMakeCache.txt; then
            echo "::warning::libavfilter was not found: this ld-analyse has no video filters"
          fi
          cmake --build build --parallel
          test -x build/bin/ld-container || { echo "::error::ld-container was not built (libebml or libmatroska not found)"; exit 1; }

      - name: Assemble app bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package-root
          mkdir -p package-root
          cp -R build/bin/ld-analyse.app package-root/

          APP_BUNDLE="$PWD/package-root/ld-analyse.app"
          exe_args=()
          for exe in build/bin/*; do
            [[ -f "$exe" && -x "$exe" ]] || continue
            name="$(basename "$exe")"
            cp "$exe" "$APP_BUNDLE/Contents/MacOS/$name"
            exe_args+=("-executable=$APP_BUNDLE/Contents/MacOS/$name")
          done

          # Bundles Qt and every non-system dylib (fftw from Homebrew) into
          # Contents/Frameworks and rewrites the load paths of the app and all
          # the command-line tools to point there.
          macdeployqt "$APP_BUNDLE" -always-overwrite "${exe_args[@]}"

      - name: Re-sign app bundle
        shell: bash
        run: |
          APP_BUNDLE="$PWD/package-root/ld-analyse.app"
          codesign --force --deep --sign - --timestamp=none "$APP_BUNDLE"
          codesign --verify --deep --strict "$APP_BUNDLE"

      # (a library for both architectures, as those of Qt Multimedia are, has a line "path (architecture arm64):" for each in the
      # output of otool, which is not a dependency)
      # (a library for both architectures, as those of Qt Multimedia are, has in the output of otool a line "path (architecture arm64):"
      # for each of them, which is not a dependency: the lines that end with a colon are left out)
      - name: Verify standalone app bundle
        shell: bash
        run: |
          APP_BUNDLE="$PWD/package-root/ld-analyse.app"
          FAIL=0
          while IFS= read -r target; do
            while IFS= read -r dep; do
              [[ -z "$dep" ]] && continue
              case "$dep" in
                /System/*|/usr/lib/*|@rpath/*|@loader_path/*|@executable_path/*)
                  ;;
                *)
                  echo "External dependency in $target: $dep" >&2
                  FAIL=1
                  ;;
              esac
            done < <(otool -L "$target" | tail -n +2 | grep -v ":$" | awk '{print $1}')
          done < <(
            find "$APP_BUNDLE/Contents/MacOS" -type f
            find "$APP_BUNDLE/Contents/Frameworks" -type f -name "*.dylib" 2>/dev/null || true
          )
          if [[ "$FAIL" -ne 0 ]]; then
            echo "Standalone verification failed" >&2
            exit 1
          fi

      - name: Smoke test bundled tools
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          for exe in package-root/ld-analyse.app/Contents/MacOS/*; do
            "$exe" --help > /dev/null
            echo "$(basename "$exe"): ok"
          done

      - name: Create DMG
        shell: bash
        run: |
          # macos-latest runners are Apple Silicon; name the artifact by the
          # architecture actually built so Intel users are not misled.
          DMG_NAME="ld-decode-tools-${{ steps.version.outputs.version }}-macos-$(uname -m).dmg"
          VOL_NAME="ld-decode-tools ${{ steps.version.outputs.version }}"
          rm -rf dmg-root
          mkdir -p dmg-root dist
          cp -R package-root/ld-analyse.app dmg-root/
          cp README.md LICENSE dmg-root/
          ln -s /Applications dmg-root/Applications

          # hdiutil intermittently reports "resource busy" on shared runners.
          for attempt in 1 2 3 4 5; do
            hdiutil detach "/Volumes/$VOL_NAME" -force > /dev/null 2>&1 || true
            if hdiutil create -volname "$VOL_NAME" -srcfolder dmg-root -ov -format UDZO "dist/$DMG_NAME"; then
              hdiutil verify "dist/$DMG_NAME"
              ls -lh dist
              exit 0
            fi
            echo "hdiutil create failed (attempt $attempt); retrying..." >&2
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
