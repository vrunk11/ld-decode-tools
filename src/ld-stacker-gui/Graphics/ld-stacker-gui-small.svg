<?xml version="1.0" encoding="utf-8"?>
<!-- The icon on the grid of 16 x 16 pixels, for the small sizes: a grey disc with the colours of its
     reflection, an arrow down, and the discs that are stacked, in different greys and each a pixel off the
     one above. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <circle cx="5" cy="5" r="4" fill="#C8CBC4" stroke="#555753" stroke-width="1"/>
  <g>
    <rect x="3" y="2" width="2" height="1" fill="#FFFFFF"/>
    <rect x="6" y="2" width="1" height="1" fill="#6FD3E8"/>
    <rect x="7" y="3" width="1" height="1" fill="#C792EA"/>
    <rect x="7" y="6" width="1" height="1" fill="#F2C94C"/>
    <rect x="3" y="7" width="1" height="1" fill="#F28CB6"/>
    <rect x="2" y="4" width="1" height="1" fill="#8FE0A0"/>
  </g>
  <circle cx="5" cy="5" r="1" fill="#2E3436"/>
  <rect x="12" y="1" width="1" height="6" fill="#555753"/>
  <path d="M10 6h5v1h-1v1h-1v1h-1v-1h-1v-1h-1z" fill="#555753"/>
  <rect x="2" y="10" width="13" height="1" fill="#BCBFB7"/>
  <rect x="1" y="12" width="13" height="1" fill="#A0A39B"/>
  <rect x="2" y="14" width="13" height="1" fill="#6E706A"/>
</svg>
