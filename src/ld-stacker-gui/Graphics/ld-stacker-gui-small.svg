  <g fill="#FFFFFF" fill-opacity="0.85">
    <rect x="3" y="2" width="2" height="1"/>
    <rect x="2" y="3" width="1" height="2"/>
    <rect x="7" y="7" width="1" height="1" fill-opacity="0.5"/>
  </g>
  <rect x="12" y="1" width="1" height="6" fill="#555753"/>
  <path d="M10 6h5v1h-1v1h-1v1h-1v-1h-1v-1h-1z" fill="#555753"/>
  <rect x="2" y="10" width="13" height="1" fill="#BCBFB7"/>
