<?xml version="1.0" encoding="utf-8"?>
<!-- The icon on the grid of 16 x 16 pixels, for the small sizes: discs close up, the one in the middle
     partly covered by the two that run off the edge, the one in front yellow. Outlines of one pixel. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <defs><clipPath id="c"><rect width="16" height="16"/></clipPath></defs>
  <g clip-path="url(#c)">
    <g stroke="#555753" stroke-width="1">
      <circle cx="3" cy="3" r="6.5" fill="#A1A59B"/>
      <circle cx="8" cy="8" r="5.5" fill="#CFD2CB"/>
      <circle cx="13" cy="13" r="6.5" fill="#F2C94C"/>
    </g>
    <g fill="#2E3436">
      <circle cx="3" cy="3" r="1.1"/>
      <circle cx="8" cy="8" r="1"/>
      <circle cx="13" cy="13" r="1.1"/>
    </g>
  </g>
</svg>
